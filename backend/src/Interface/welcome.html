<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <link rel="stylesheet" href="style/welcome.css">
</head>
<body>
    <div class="welcome-page">

        <div class="brand">JAEWAEW SHOP</div>

        <button class="close-button" type="button" aria-label="Close">×</button>

        <div class="welcome-box">
            <h1>Welcome!</h1>

            <p class="user-name" id="user-name">-</p>

            <div class="user-info">
                <p><span>User ID</span><strong id="user-id">-</strong></p>
                <p><span>Role</span><strong id="user-role">-</strong></p>
                <p><span>Branch</span><strong id="user-branch">-</strong></p>
            </div>

            <button class="continue-button" type="button">Continue</button>

            <p class="policy">
            </p>
        </div>

        <div class="footer-text">Market Corps. System</div>

    </div>

    <script src="js/auth.js"></script>
</body>
</html>
