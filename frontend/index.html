<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; width: 360px; padding: 28px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
    .tab-btn { flex: 1; padding: 10px; background: none; border: none; font-size: 15px; font-weight: 600; color: #64748b; cursor: pointer; }
    .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: #334155; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    input:focus { border-color: #2563eb; }
    button.submit-btn { width: 100%; padding: 11px; background: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button.submit-btn:hover { background: #1d4ed8; }
    .hidden { display: none; }
    .message { margin-top: 14px; font-size: 13px; text-align: center; }
    .message.error { color: #dc2626; }
    .message.success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <div class="tabs">
      <button id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button id="tabRegister" class="tab-btn" onclick="switchTab('register')">Sign Up</button>
    </div>

    <!--Login-->
    <form id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="submit-btn">Login</button>
    </form>

    <!--Register -->
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regName">Username</label>
        <input type="text" id="regName" placeholder="" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="example@gmail.com" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="submit-btn">Sign Up</button>
    </form>

    <div id="statusMsg" class="message"></div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
