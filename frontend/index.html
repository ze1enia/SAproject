<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; width: 360px; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
    h2 { text-align: center; color: #1e293b; margin-bottom: 24px; font-size: 22px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; font-weight: 500; color: #475569; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #2563eb; }
    button.submit-btn { width: 100%; padding: 12px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button.submit-btn:hover { background: #1d4ed8; }
    .message { margin-top: 14px; font-size: 13px; text-align: center; }
    .message.error { color: #dc2626; }
    .message.success { color: #16a34a; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Login</h2>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn">Login</button>
    </form>

    <div id="statusMsg" class="message"></div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
